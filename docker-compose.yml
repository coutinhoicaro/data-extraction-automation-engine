version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: extraction_redis_broker
    restart: always
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: extraction_postgres_warehouse
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    build: .
    container_name: extraction_pipeline_worker
    restart: on-failure
    depends_on:
      - redis
      - postgres
    env_file:
      - .env

volumes:
  postgres_data:
